name: Neon Hosted Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

concurrency:
  group: neon-hosted-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh hosted Neon slice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # publish range-labeled chunks to a GitHub Release
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      ONNX_MODEL_DIR: data/models/all-MiniLM-L6-v2-onnx
      SCRAPE_YEAR: ""
      SCRAPE_BUDGET: "80m"  # per-run scrape time box; hitting it is success — resume tomorrow
    steps:
      - uses: actions/checkout@v4

      - name: Set scrape year
        run: echo "SCRAPE_YEAR=$(date +%Y)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-hosted-refresh-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-hosted-refresh-${{ runner.os }}-

      - name: Cache ONNX bundle
        id: onnx-cache
        uses: actions/cache@v4
        with:
          path: data/models/all-MiniLM-L6-v2-onnx
          key: hosted-onnx-${{ runner.os }}-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: poetry install --with ml

      - name: Validate required secrets
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL is not configured"
            exit 1
          fi

      - name: Export ONNX bundle if cache is cold
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: |
          poetry install --with ml_torch
          poetry run python -m src.cli embed-export-onnx all-MiniLM-L6-v2 --output-dir "$ONNX_MODEL_DIR"

      - name: Scrape current year jobs into Neon
        run: |
          echo "RUN_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          set +e
          timeout "$SCRAPE_BUDGET" poetry run python -m src.cli scrape-historical \
            --year "$SCRAPE_YEAR" \
            --resume \
            --db "$NEON_DATABASE_URL"
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::notice::Hit ${SCRAPE_BUDGET} scrape budget; chunk published, resuming tomorrow."
          elif [ "$code" -ne 0 ]; then
            echo "::error::Scrape failed (exit $code)."
            exit "$code"
          fi

      - name: Publish range-labeled chunk to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="archive-$SCRAPE_YEAR"
          # Baseline is "done" only once a baseline asset actually exists -- not
          # merely once the release exists. create + upload are separate steps,
          # so a failed upload could otherwise leave an empty release that masks
          # a never-archived baseline and lets the purge delete preexisting rows.
          # The first run dumps the whole table; later runs export only changes.
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q -- '-baseline-'; then
            export ARCHIVE_BASELINE=0
          else
            export ARCHIVE_BASELINE=1
          fi
          poetry run python scripts/neon_chunk.py
          source chunk.env
          if [ "${CHUNK_ROWS:-0}" -eq 0 ]; then
            echo "::notice::No rows to archive this run; nothing to publish."
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "MCF archive $SCRAPE_YEAR" \
              --notes "Restorable JSONL chunks for $SCRAPE_YEAR: one baseline dump plus per-run deltas, each labeled by run timestamp and scrape watermark (current_seq). Concatenate all assets and replay (idempotent upserts) to restore the full $SCRAPE_YEAR slice."
          gh release upload "$TAG" "$CHUNK_FILE" --clobber
          {
            echo "## Neon chunk published"
            echo ""
            echo "- Asset: \`$CHUNK_FILE\`"
            echo "- Rows: $CHUNK_ROWS"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync hosted job embeddings
        run: |
          poetry run python -m src.cli embed-sync \
            --db "$NEON_DATABASE_URL" \
            --embedding-backend onnx \
            --onnx-model-dir "$ONNX_MODEL_DIR" \
            --no-update-index

      - name: Purge hosted slice
        run: |
          poetry run python -m src.cli pg-purge-hosted \
            --target "$NEON_DATABASE_URL" \
            --max-age-days 90

      - name: Verify hosted retention and embeddings
        run: |
          poetry run python - <<'PY'
          import os
          import psycopg

          dsn = os.environ["NEON_DATABASE_URL"]
          with psycopg.connect(dsn) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT COUNT(*)
                      FROM jobs
                      WHERE posted_date IS NULL
                         OR posted_date < GREATEST(
                              DATE_TRUNC('year', CURRENT_DATE)::date,
                              CURRENT_DATE - INTERVAL '90 days'
                            )
                      """
                  )
                  old_jobs = cur.fetchone()[0]
                  cur.execute("SELECT COUNT(*) FROM embeddings WHERE entity_type IN ('skill', 'company')")
                  non_job_embeddings = cur.fetchone()[0]
                  cur.execute("SELECT COUNT(*) FROM embeddings WHERE entity_type = 'job'")
                  job_embeddings = cur.fetchone()[0]

          if old_jobs:
              raise SystemExit(f"Hosted purge failed: {old_jobs} old/null-dated jobs remain")
          if non_job_embeddings:
              raise SystemExit(f"Hosted purge failed: {non_job_embeddings} non-job embeddings remain")
          if job_embeddings == 0:
              raise SystemExit("Hosted refresh produced zero job embeddings")

          print(f"Verified hosted slice: {job_embeddings} job embeddings, retention window enforced")
          PY

      - name: Build UI aggregate snapshots
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MCF_SEARCH_BACKEND: pgvector
          MCF_LEAN_HOSTED: "1"
          MCF_EMBEDDING_BACKEND: onnx
          MCF_ONNX_MODEL_DIR: data/models/all-MiniLM-L6-v2-onnx
        run: poetry run python scripts/build_aggregates.py

      - name: Commit snapshots if changed
        run: |
          # No [skip ci] — Cloudflare Pages honors skip markers and would skip the
          # rebuild we want. This push does not re-trigger this workflow (schedule/
          # dispatch only). Pages production branch must be the branch this runs on.
          if [ -n "$(git status --porcelain src/frontend/public/snapshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/frontend/public/snapshots/*.json
            git commit -m "chore(ui): refresh aggregate snapshots"
            # Rebase onto any commits that landed during this long-running job so
            # the push is fast-forward rather than silently rejected.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No snapshot changes to commit."
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Neon hosted refresh failed for year $SCRAPE_YEAR. Check the logs above for details."
          echo "## Neon Hosted Refresh Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Year**: $SCRAPE_YEAR" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
